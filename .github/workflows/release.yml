name: Build and Publish Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: |
          $url = "https://jrsoftware.org/download.php/is.exe"
          $setupPath = Join-Path $env:TEMP "innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $setupPath
          Start-Process $setupPath -ArgumentList "/VERYSILENT /DIR=C:\InnoSetup" -Wait

      - name: Build installer
        shell: powershell
        run: |
          & "C:\InnoSetup\ISCC.exe" "SC-AKX200-Setup.iss"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC-AKX200-Setup
          path: Output/*.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
